<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>College Hub</title>
<meta name="description" content="A simple college management portal: students, teachers, classes, subjects and fees.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213d;--muted:#5d6b82;--paper:#f4f7fb;--card:#fff;--line:#e2e8f1;--teal:#0f9d8a;--teal-d:#0a7a6b;--amber:#f4a300;--coral:#e4572e;--blue:#3a6ff7;--r:16px}
*{box-sizing:border-box;margin:0}
body{font:16px/1.5 'DM Sans',system-ui,sans-serif;color:var(--ink);background:var(--paper);display:flex;min-height:100vh}
h1,h2,h3{font-family:'Bricolage Grotesque','DM Sans',sans-serif;line-height:1.15}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.side{width:232px;background:var(--ink);color:#fff;padding:24px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;font:700 21px 'Bricolage Grotesque',sans-serif;margin:0 8px 22px}
.brand i{font-style:normal;background:var(--amber);width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px}
.side button.nav{display:flex;align-items:center;gap:12px;background:none;border:0;color:#b9c4da;padding:12px 14px;border-radius:12px;text-align:left;font-weight:500}
.side button.nav:hover{background:#1f3158;color:#fff}
.side button.nav.on{background:var(--teal);color:#fff}
.side small{margin:auto 8px 0;color:#8794ad;font-size:13px}
main{flex:1;min-width:0;padding:32px clamp(16px,4vw,44px) 90px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.top h1{font-size:clamp(26px,4vw,36px)}
.top p{color:var(--muted)}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.stat b{display:block;font:800 34px 'Bricolage Grotesque',sans-serif}
.stat span{color:var(--muted);font-size:14px}
.stat .ic{font-size:22px;float:right;background:var(--paper);width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.ring div{background:#fff;width:108px;height:108px;border-radius:50%;display:grid;place-items:center;text-align:center;font:800 26px 'Bricolage Grotesque',sans-serif;line-height:1}
.ring small{display:block;font:500 12px 'DM Sans';color:var(--muted);margin-top:4px}
.row{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.bar{height:12px;background:var(--paper);border-radius:9px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--teal);border-radius:9px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.tools input,.tools select{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:44px}
.tools input{flex:1;min-width:200px}
.btn{background:var(--teal);color:#fff;border:0;border-radius:12px;padding:10px 18px;font-weight:700;min-height:44px}
.btn:hover{background:var(--teal-d)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--paper)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:14px}
.btn.red{background:#fff;color:var(--coral);border:1px solid #f3c6b9}
.wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;min-width:640px}
th{text-align:left;font-size:13px;color:var(--muted);font-weight:700;padding:12px 16px;background:#fafcfe;border-bottom:1px solid var(--line)}
td{padding:12px 16px;border-bottom:1px solid var(--line)}
tr:last-child td{border:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:#f6fbfa}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:700}
.ok{background:#dff5f0;color:#0a7a6b}.no{background:#fde8e1;color:#b8401f}
.chip{display:inline-block;background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:3px 11px;font-size:13px;margin:0 6px 6px 0}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex-shrink:0}
.empty{padding:36px;text-align:center;color:var(--muted)}
dialog{border:0;border-radius:20px;padding:26px;width:min(520px,94vw);box-shadow:0 20px 60px #14213d55}
dialog::backdrop{background:#14213d99}
dialog form{display:grid;gap:12px}
label{display:grid;gap:4px;font-size:14px;font-weight:700}
label input,label select{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:400;min-height:44px}
.acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
.toast.show{opacity:1}
.credit{position:fixed;right:14px;bottom:12px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:13px;color:var(--muted);z-index:20;box-shadow:0 4px 14px #14213d1a}
.credit b{color:var(--ink)}
@media(max-width:820px){
body{display:block}
.side{position:fixed;bottom:0;top:auto;left:0;right:0;width:auto;height:auto;flex-direction:row;padding:6px;z-index:30;justify-content:space-around;gap:2px;overflow-x:auto}
.brand,.side small{display:none}
.side button.nav{flex-direction:column;gap:2px;padding:8px 6px;font-size:11px;flex:1;min-width:62px;align-items:center}
.credit{bottom:74px;right:10px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.first{background:#fff8e6;border:1px solid #f6d58a;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14px;line-height:1.8}
code{background:#fff;border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-weight:700}
.about ol{margin:10px 0 0 22px;display:grid;gap:10px}.about li b{color:var(--ink)}.about a{color:inherit;font-weight:700}.about .ft{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);text-align:center;padding-bottom:70px}
</style>
</head>
<body>
<aside class="side" id="side">
  <div class="brand"><i>🎓</i>College Hub</div>
  <button class="nav on" data-v="dash">📊 <span>Dashboard</span></button>
  <button class="nav" data-v="students">🧑‍🎓 <span>Students</span></button>
  <button class="nav" data-v="teachers">👨‍🏫 <span>Teachers</span></button>
  <button class="nav" data-v="subjects">📖 <span>Subjects</span></button>
  <button class="nav" data-v="classes">📚 <span>Classes</span></button>
  <button class="nav" data-v="fees">💳 <span>Fees</span></button>
  <button class="nav" data-v="sal">💰 <span>Salaries</span></button>
  <button class="nav" data-v="about">ℹ️ <span>About</span></button>
  <small>Connected to your college database.</small>
</aside>
<main id="view"></main>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status"></div>
<div class="credit">Created By : <b>Muhammad Talha Ijaz</b></div>

<script>
const API_URL='https://college-hub-sn4f.vercel.app'; // after deploying the backend, replace with your live API address
const $=s=>document.querySelector(s);
let db=null,tok=sessionStorage.getItem('chtok'),view='dash',F={q:'',c:'',s:''};
let SAL=null,SM=new Date().toISOString().slice(0,7),ME=sessionStorage.getItem('chme')||'admin';
const FULL={FA:'Faculty of Arts',FSC:'Faculty of Science',ICOM:'Intermediate in Commerce',ICS:'Intermediate in Computer Science'};
const cls=id=>db.classes.find(c=>c.id==id)||{name:'?',subjects:[]};
const sub=id=>db.subjects.find(s=>s.id==id)||{name:'?'};
const tea=id=>db.teachers.find(t=>t.id==id)||{name:'?'};
const full=c=>FULL[c.name]||'';
const cap=g=>g?g[0].toUpperCase()+g.slice(1).toLowerCase():'Male';
const rs=n=>'Rs '+Number(n).toLocaleString('en-PK');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COL=['#3a6ff7','#0f9d8a','#e4572e','#8a4fff','#f4a300','#d6336c'];
const av=n=>`<span class="av" style="background:${COL[n.charCodeAt(0)%COL.length]}">${esc(n[0])}</span>`;
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),3200)};
const sv=s=>({name:s.name,email:s.email,gender:s.gender,phone:s.phone,age:s.age,cid:s.cid,fee:s.fee,paid:s.paid});

async function api(m,p,b){
  let r;
  try{r=await fetch(API_URL+p,{method:m,headers:{'Content-Type':'application/json',...(tok?{Authorization:'Bearer '+tok}:{})},body:b?JSON.stringify(b):undefined})}
  catch(e){throw Error('Cannot reach the server. Check API_URL and that the backend is running.')}
  const j=await r.json().catch(()=>({}));
  if(r.status==401&&p!='/api/login'){logout();throw Error('Session expired. Please sign in again.')}
  if(!r.ok){const er=Error(typeof j.detail=='string'?j.detail:'Some values are invalid. Please check the form.');er.status=r.status;throw er}
  return j;
}
const loadSal=async()=>{SAL={month:SM,rows:await api('GET','/api/salaries/'+SM)}};
const reload=async()=>{db=await api('GET','/api/data');if(view=='sal')await loadSal()};
const keep=()=>{const y=scrollY;render();scrollTo(0,y)};
async function run(fn,msg,after=render){try{await fn();await reload();after();toast(msg)}catch(e){toast(e.message)}}
function logout(){tok=null;db=null;sessionStorage.removeItem('chtok');render()}
async function start(){
  if(!tok)return render();
  try{await reload();const bn=document.querySelector('.brand');if(bn)bn.innerHTML='<i>🎓</i>'+esc(db.college||'College Hub');render()}catch(e){if(!tok)return;if(e.status==403)return pwView(true);$('#side').style.display='none';$('#view').innerHTML=`<div class="empty">${esc(e.message)}<br><button class="btn" style="margin-top:12px" onclick="start()">Try again</button></div>`}
}

async function loginView(mode='in'){
  $('#side').style.display='none';
  $('#view').innerHTML='<div class="empty">Loading…</div>';
  let st={};try{st=await api('GET','/api/status')}catch(e){toast(e.message)}
  const reg=mode=='reg';
  $('#view').innerHTML=`<div class="card" style="max-width:400px;margin:8vh auto"><h1 style="font-size:28px">College Hub</h1><p style="color:var(--muted);margin:6px 0 16px">${reg?'Register your college or school. You will get your own private login and data.':'Sign in to manage your students, teachers, salaries and fees.'}</p>
  <form id="lf" class="grid" style="gap:12px">${reg?'<label>College / school name<input name="n" minlength="2" maxlength="80" required></label>':''}<label>Username<input name="u" autocomplete="username" minlength="${reg?3:1}" maxlength="40" required></label><label>Password${reg?' (at least 8 characters)':''}<input name="p" type="password" autocomplete="${reg?'new-password':'current-password'}" minlength="${reg?8:1}" required></label>${reg&&st.code_required?'<label>Signup code<input name="c" required></label>':''}<button class="btn">${reg?'Create account':'Sign in'}</button></form>
  <p style="margin-top:14px;text-align:center"><a href="#" id="sw" style="color:var(--muted)">${reg?'Already registered? Sign in':'New college or school? Register here'}</a></p></div>`;
  $('#sw').onclick=e=>{e.preventDefault();loginView(reg?'in':'reg')};
  $('#lf').onsubmit=async e=>{e.preventDefault();const d=new FormData(e.target);
    try{const r=reg?await api('POST','/api/register',{college:d.get('n'),username:d.get('u'),password:d.get('p'),code:d.get('c')||''}):await api('POST','/api/login',{username:d.get('u'),password:d.get('p')});
      tok=r.token;ME=r.username;sessionStorage.setItem('chtok',tok);sessionStorage.setItem('chme',ME);r.must_change?pwView(true):await start()}catch(x){toast(x.message)}};
}
function pwView(forced){
  $('#side').style.display='none';
  $('#view').innerHTML=`<div class="card" style="max-width:420px;margin:8vh auto"><h1 style="font-size:26px">${forced?'Set your own password':'Change password'}</h1><p style="color:var(--muted);margin:6px 0 16px">${forced?'Please choose your own username and password to continue.':'Update your admin username or password.'}</p>
  <form id="pf" class="grid" style="gap:12px"><label>Current password<input name="c" type="password" autocomplete="current-password" required></label><label>Username<input name="u" minlength="3" maxlength="40" required value="${esc(ME)}"></label><label>New password (at least 8 characters)<input name="p" type="password" minlength="8" autocomplete="new-password" required></label><label>Repeat new password<input name="r" type="password" minlength="8" autocomplete="new-password" required></label>
  <div class="acts">${forced?'<button type="button" class="btn ghost" data-act="out">Log out</button>':`<button type="button" class="btn ghost" data-v="${view}">Cancel</button>`}<button class="btn">Save password</button></div></form></div>`;
  $('#pf').onsubmit=async e=>{e.preventDefault();const d=new FormData(e.target);
    if(d.get('p')!=d.get('r'))return toast('The two new passwords do not match');
    try{const r=await api('POST','/api/change-password',{current:d.get('c'),username:d.get('u'),password:d.get('p')});tok=r.token;ME=r.username;sessionStorage.setItem('chtok',tok);sessionStorage.setItem('chme',ME);await start();toast('Password changed')}catch(x){toast(x.message)}};
}

const head=(t,p,btn='')=>`<div class="top"><div><h1>${t}</h1><p>${p}</p></div><div class="row" style="gap:10px">${btn}<button class="btn ghost" data-act="pw">🔑 Password</button><button class="btn ghost" data-act="out">Log out</button></div></div>`;
const stat=(ic,n,l)=>`<div class="card stat"><span class="ic">${ic}</span><b>${n}</b><span>${l}</span></div>`;

function dash(){
  const S=db.students,paid=S.filter(s=>s.paid),pending=S.length-paid.length;
  const got=paid.reduce((a,s)=>a+s.fee,0),due=S.filter(s=>!s.paid).reduce((a,s)=>a+s.fee,0);
  const pct=S.length?Math.round(paid.length/S.length*100):0;
  const pay=db.teachers.reduce((a,t)=>a+t.salary,0);
  const mx=Math.max(1,...db.classes.map(c=>S.filter(s=>s.cid==c.id).length));
  return head('Welcome back 👋','Here is how your college looks today.')+
  `<div class="grid g4">${stat('🧑‍🎓',S.length,'Students')+stat('👨‍🏫',db.teachers.length,'Teachers')+stat('📖',db.subjects.length,'Subjects')+stat('💼',rs(pay),'Total teacher salaries')}</div>
  <div class="grid g2" style="margin-top:16px">
   <div class="card"><h3 style="margin-bottom:16px">Fee collection</h3><div class="row">
    <div class="ring" style="background:conic-gradient(var(--teal) ${pct*3.6}deg,#fde8e1 0)"><div><span>${pct}%<small>paid</small></span></div></div>
    <div><p><span class="pill ok">${paid.length} paid</span> &nbsp;<span class="pill no">${pending} pending</span></p>
    <p style="margin-top:10px">Collected: <b>${rs(got)}</b></p><p>Still due: <b>${rs(due)}</b></p>
    <button class="btn sm" style="margin-top:10px" data-go="fees">See pending fees</button></div></div></div>
   <div class="card"><h3 style="margin-bottom:12px">Students per class</h3>${db.classes.map(c=>{const n=S.filter(s=>s.cid==c.id).length;return `<div><b>${esc(c.name)}</b> <span style="color:var(--muted)">${full(c)?'– '+esc(full(c))+' · ':'– '}${n} students</span><div class="bar"><i style="width:${n/mx*100}%"></i></div></div>`}).join('')}</div>
  </div>`;
}

function filtered(){
  const q=F.q.toLowerCase();
  return db.students.filter(s=>(!q||(s.name+s.email+s.regno+s.phone).toLowerCase().includes(q))&&(!F.c||s.cid==F.c)&&(!F.s||(F.s=='paid')==s.paid));
}
const tools=addBtn=>`<div class="tools"><input id="q" type="search" placeholder="Search name, reg no, email or phone" value="${esc(F.q)}" aria-label="Search students">
  <select id="fc" aria-label="Class"><option value="">All classes</option>${db.classes.map(c=>`<option value="${c.id}" ${F.c==c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
  <select id="fs" aria-label="Fee status"><option value="">All fee status</option><option value="paid" ${F.s=='paid'?'selected':''}>Paid</option><option value="pending" ${F.s=='pending'?'selected':''}>Pending</option></select>${addBtn}</div>`;
function rowsOf(list,fee){
  if(!list.length)return `<div class="empty">No students match. Try clearing the search or filters.</div>`;
  return `<div class="wrap"><table><thead><tr><th>Reg no</th><th>Student</th><th>Class</th>${fee?'<th>Fee</th><th>Status</th><th></th>':'<th>Phone</th><th>Fee</th>'}</tr></thead><tbody>${list.map(s=>`<tr class="click" data-open="${s.regno}"><td>${s.regno}</td><td><div class="row" style="gap:10px;flex-wrap:nowrap">${av(s.name)}<div><b>${esc(s.name)}</b><br><small style="color:var(--muted)">${esc(s.email)}</small></div></div></td><td>${esc(cls(s.cid).name)}</td>${fee?`<td>${rs(s.fee)}</td><td><span class="pill ${s.paid?'ok':'no'}">${s.paid?'Paid':'Pending'}</span></td><td><button class="btn sm ${s.paid?'ghost':''}" data-pay="${s.regno}">${s.paid?'Mark pending':'Mark paid'}</button></td>`:`<td>${esc(s.phone)}</td><td><span class="pill ${s.paid?'ok':'no'}">${s.paid?'Paid':'Pending'}</span></td>`}</tr>`).join('')}</tbody></table></div>`;
}
const students=()=>{const l=filtered();return head('Students',`${l.length} of ${db.students.length} students`,`<button class="btn ghost" data-act="csv">Download CSV</button><button class="btn" data-act="add">+ Add student</button>`)+tools('')+`<div id="list">${rowsOf(l,false)}</div>`};
const fees=()=>{const l=filtered();return head('Fees',`Pending in this list: <b>${rs(l.filter(s=>!s.paid).reduce((a,s)=>a+s.fee,0))}</b>`)+tools('')+`<div id="list">${rowsOf(l,true)}</div>`};
function teachers(){
  return head('Teachers',`${db.teachers.length} teachers`,`<button class="btn" data-act="addt">+ Add teacher</button>`)+`<div class="grid g2">${db.teachers.map(t=>{
    const ss=db.subjects.filter(s=>s.tid==t.id);
    return `<div class="card"><div class="row" style="gap:12px;flex-wrap:nowrap;justify-content:space-between"><div class="row" style="gap:12px;flex-wrap:nowrap">${av(t.name)}<div><h3 style="font-size:19px">${esc(t.name)}</h3><small style="color:var(--muted)">${esc(cap(t.gender))} · ${t.age} years</small></div></div><button class="btn ghost sm" data-edit="t:${t.id}">Edit</button></div>
    <p style="margin-top:14px">Salary: <b>${rs(t.salary)}</b> &nbsp;<button class="btn ghost sm" data-hist="${t.id}">Salary record</button></p>
    <p style="margin:10px 0 8px"><small style="color:var(--muted)">Teaches</small></p>${ss.map(s=>`<span class="chip">${esc(s.name)}</span>`).join('')||'–'}</div>`}).join('')}</div>`;
}
function subjects(){
  return head('Subjects',`${db.subjects.length} subjects`,`<button class="btn" data-act="addj">+ Add subject</button>`)+`<div class="wrap"><table><thead><tr><th>ID</th><th>Subject</th><th>Teacher</th><th>Classes</th><th></th></tr></thead><tbody>${db.subjects.map(s=>`<tr><td>${s.id}</td><td><b>${esc(s.name)}</b></td><td>${esc(tea(s.tid).name)}</td><td>${db.classes.filter(c=>c.subjects.includes(s.id)).map(c=>`<span class="chip">${esc(c.name)}</span>`).join('')||'–'}</td><td><button class="btn ghost sm" data-edit="j:${s.id}">Edit</button></td></tr>`).join('')}</tbody></table></div>`;
}
function classes(){
  return head('Classes',`Subjects each class studies, and who teaches them`,`<button class="btn" data-act="addc">+ New class</button>`)+`<div class="grid g2">${db.classes.map(c=>`<div class="card"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><div><h3>${esc(c.name)}</h3><p style="color:var(--muted);margin-bottom:12px">${full(c)?esc(full(c))+' · ':''}${db.students.filter(s=>s.cid==c.id).length} students</p></div><button class="btn ghost sm" data-edit="c:${c.id}">Edit</button></div>${c.subjects.map(id=>{const s=sub(id);return `<div class="row" style="justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--line)"><b>${esc(s.name)}</b><span style="color:var(--muted)">${esc(tea(s.tid).name)}</span></div>`}).join('')}</div>`).join('')}</div>`;
}

function sal(){
  const R=SAL.rows,P=R.filter(r=>r.paid),tot=a=>a.reduce((x,r)=>x+r.amount,0);
  return head('Salaries','Monthly salary record for every teacher',`<input type="month" id="sm" value="${SM}" aria-label="Month" style="border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:44px;background:#fff">`)+
  `<div class="grid g4" style="margin-bottom:16px">${stat('💼',rs(tot(R)),'Total for the month')+stat('✅',rs(tot(P)),P.length+' teachers paid')+stat('⏳',rs(tot(R)-tot(P)),(R.length-P.length)+' pending')}</div>
  <div class="wrap"><table><thead><tr><th>Teacher</th><th>Amount</th><th>Status</th><th>Paid on</th><th></th></tr></thead><tbody>${R.map(r=>`<tr class="click" data-hist="${r.tid}"><td><b>${esc(r.name)}</b>${r.note?`<br><small style="color:var(--muted)">${esc(r.note)}</small>`:''}</td><td>${rs(r.amount)}</td><td><span class="pill ${r.paid?'ok':'no'}">${r.paid?'Paid':'Pending'}</span></td><td>${r.paid_on||'–'}</td><td><div class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn sm ${r.paid?'ghost':''}" data-spay="${r.tid}">${r.paid?'Undo':'Mark paid'}</button><button class="btn ghost sm" data-sedit="${r.tid}">Edit</button></div></td></tr>`).join('')}</tbody></table></div>`;
}
async function hist(tid){
  try{const h=await api('GET','/api/salaries/teacher/'+tid),t=tea(tid);
  $('#dlg').innerHTML=`<h2>${esc(t.name)}</h2><p style="color:var(--muted);margin-bottom:12px">Current salary: <b>${rs(t.salary)}</b> · salary record</p>${h.length?`<div class="wrap"><table style="min-width:0"><thead><tr><th>Month</th><th>Amount</th><th>Status</th></tr></thead><tbody>${h.map(x=>`<tr><td>${x.month}</td><td>${rs(x.amount)}</td><td><span class="pill ${x.paid?'ok':'no'}">${x.paid?'Paid '+(x.paid_on||''):'Pending'}</span></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No payments recorded yet. Use the Salaries page to mark a month as paid.</div>'}<div class="acts"><button class="btn" data-close>Close</button></div>`;
  $('#dlg').showModal()}catch(e){toast(e.message)}
}
function salForm(tid){
  const r=SAL.rows.find(x=>x.tid==tid);
  ask(`${esc(r.name)} – ${SM}`,[{k:'amount',l:'Amount for this month (Rs)',t:'number',a:'min=0 step=500'},{k:'paid',l:'Status',t:'select',b:1,o:[['false','Pending'],['true','Paid']]},{k:'note',l:'Note (optional, e.g. bonus or deduction)',t:'text',opt:1,a:'maxlength=100'}],
    {amount:r.amount,paid:String(r.paid),note:r.note},d=>api('PUT',`/api/salaries/${tid}/${SM}`,d));
}
function about(){
  return `<div class="about">${head('About','Everything you need to know about College Hub')}
  <div class="card"><h2>What is College Hub?</h2><p style="color:var(--muted);margin-top:8px">College Hub is a simple online panel where a college, school or academy manages its students, teachers, subjects, classes, fees and teacher salaries. Every college signs in with its own username and password and only sees its own data.</p></div>
  <div class="card" style="margin-top:16px"><h2>How to use it (follow this order)</h2>
    <ol>
      <li><b>Add Teachers first.</b> Open <i>Teachers</i> and add every teacher with name, age, gender and salary.</li>
      <li><b>Then add Subjects.</b> Open <i>Subjects</i> and create each subject, choosing the teacher who teaches it.</li>
      <li><b>Then create Classes.</b> Open <i>Classes</i>, name the class and tick the subjects that belong to it.</li>
      <li><b>Finally add Students.</b> Open <i>Students</i>, add each student, pick their class and set the fee.</li>
      <li><b>Daily work:</b> use <i>Fees</i> to mark fees paid or pending and <i>Salaries</i> to record teacher salaries month by month.</li>
    </ol></div>
  <div class="card" style="margin-top:16px"><h2>Created by</h2><p style="margin-top:8px"><b>Muhammad Talha Ijaz</b><br><span style="color:var(--muted)">Email:</span> <a href="mailto:mtalhaijaz997@gmail.com">mtalhaijaz997@gmail.com</a></p></div>
  <div class="ft">Contact me to create websites like these for your own use and customize them: <a href="mailto:mtalhaijaz997@gmail.com">mtalhaijaz997@gmail.com</a></div></div>`;
}
function render(){
  if(!tok||!db)return loginView();
  $('#side').style.display='';
  document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on',b.dataset.v==view));
  $('#view').innerHTML={dash,students,teachers,subjects,classes,fees,sal,about}[view]();
  window.scrollTo(0,0);
}
function refreshList(){
  const l=filtered();$('#list').innerHTML=rowsOf(l,view=='fees');const p=$('.top p');
  if(view=='students')p.textContent=`${l.length} of ${db.students.length} students`;
  else p.innerHTML=`Pending in this list: <b>${rs(l.filter(s=>!s.paid).reduce((a,s)=>a+s.fee,0))}</b>`;
}

/* one reusable edit/add dialog */
function ask(title,fs,v,save,del){
  $('#dlg').innerHTML=`<form id="f"><h2>${title}</h2>${fs.map(f=>`<label>${f.l}${f.t=='select'?`<select name="${f.k}">${f.o.map(([a,b])=>`<option value="${esc(a)}" ${a==v[f.k]?'selected':''}>${esc(b)}</option>`).join('')}</select>`:`<input name="${f.k}" type="${f.t}" ${f.opt?'':'required'} ${f.a||''} value="${esc(v[f.k]??'')}">`}</label>`).join('')}
  <div class="acts">${del?'<button type="button" class="btn red" id="rm">Delete</button>':''}<button type="button" class="btn ghost" data-close>Cancel</button><button class="btn">Save changes</button></div></form>`;
  $('#dlg').showModal();
  $('#f').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));
    fs.forEach(f=>{if(f.t=='number'||f.n)d[f.k]=+d[f.k];if(f.b)d[f.k]=d[f.k]=='true'});
    $('#dlg').close();run(()=>save(d),'Saved')};
  if(del)$('#rm').onclick=()=>{if(confirm('Delete permanently from the database?')){$('#dlg').close();run(del,'Deleted')}};
}
const GEN=[['Male','Male'],['Female','Female']];
function stuForm(no){
  const s=no?db.students.find(x=>x.regno==no):{name:'',email:'',gender:'Male',phone:'',age:18,cid:db.classes[0]?.id,fee:50000,paid:false};
  ask(no?'Edit student':'Add a new student',[
    {k:'name',l:'Full name',t:'text',a:'maxlength=35'},{k:'email',l:'Email',t:'email',a:'maxlength=60'},
    {k:'phone',l:'Phone (digits only)',t:'tel',a:'pattern="[0-9]{10,13}"'},{k:'gender',l:'Gender',t:'select',o:GEN},
    {k:'age',l:'Age',t:'number',a:'min=5 max=80'},{k:'cid',l:'Class',t:'select',n:1,o:db.classes.map(c=>[c.id,c.name])},
    {k:'fee',l:'Fee (Rs)',t:'number',a:'min=0 step=500'},{k:'paid',l:'Fee status',t:'select',b:1,o:[['false','Pending'],['true','Paid']]}],
    {...s,gender:cap(s.gender),paid:String(s.paid)},
    d=>no?api('PUT','/api/students/'+no,d):api('POST','/api/students',d),no&&(()=>api('DELETE','/api/students/'+no)));
}
function teaForm(id){
  const t=id?db.teachers.find(x=>x.id==id):{name:'',age:30,gender:'Male',salary:50000};
  ask(id?'Edit teacher':'Add a teacher',[
    {k:'name',l:'Full name',t:'text',a:'maxlength=25'},{k:'age',l:'Age',t:'number',a:'min=18 max=80'},
    {k:'gender',l:'Gender',t:'select',o:GEN},{k:'salary',l:'Salary (Rs)',t:'number',a:'min=0 step=500'}],
    {...t,gender:cap(t.gender)},d=>id?api('PUT','/api/teachers/'+id,d):api('POST','/api/teachers',d),id&&(()=>api('DELETE','/api/teachers/'+id)));
}
function subForm(id){
  const s=id?db.subjects.find(x=>x.id==id):{name:'',tid:db.teachers[0]?.id};
  ask(id?'Edit subject':'Add a subject',[
    {k:'name',l:'Subject name',t:'text',a:'maxlength=25'},{k:'tid',l:'Teacher',t:'select',n:1,o:db.teachers.map(t=>[t.id,t.name])}],
    s,d=>id?api('PUT','/api/subjects/'+id,d):api('POST','/api/subjects',d),id&&(()=>api('DELETE','/api/subjects/'+id)));
}
function editClass(id){
  const c=id?cls(id):{id:Math.max(50,...db.classes.map(x=>x.id))+1,name:'',subjects:[]};
  $('#dlg').innerHTML=`<form id="f"><h2>${id?'Edit class':'New class'}</h2><label>Class name<input name="name" required maxlength="10" value="${esc(c.name)}"></label><p><b>Subjects in this class</b></p>
  <div style="max-height:38vh;overflow:auto;display:grid;gap:6px">${db.subjects.map(s=>`<label style="display:flex;gap:10px;align-items:center;font-weight:400"><input type="checkbox" name="s" value="${s.id}" ${c.subjects.includes(s.id)?'checked':''} style="width:20px;height:20px;min-height:0"> ${esc(s.name)} <small style="color:var(--muted)">(${esc(tea(s.tid).name)})</small></label>`).join('')}</div>
  <div class="acts">${id?'<button type="button" class="btn red" id="rm">Delete class</button>':''}<button type="button" class="btn ghost" data-close>Cancel</button><button class="btn">Save changes</button></div></form>`;
  $('#dlg').showModal();
  $('#f').onsubmit=e=>{e.preventDefault();const ids=[...e.target.querySelectorAll('[name=s]:checked')].map(x=>+x.value);
    if(!ids.length)return toast('Pick at least one subject');
    const name=e.target.name.value;$('#dlg').close();run(()=>api('PUT','/api/classes/'+c.id,{name,subjects:ids}),'Saved')};
  if(id)$('#rm').onclick=()=>{if(confirm('Delete this class?')){$('#dlg').close();run(()=>api('DELETE','/api/classes/'+id),'Deleted')}};
}
function detail(no){
  const s=db.students.find(x=>x.regno==no),c=cls(s.cid);
  $('#dlg').innerHTML=`<div class="row" style="gap:14px;flex-wrap:nowrap">${av(s.name)}<div><h2>${esc(s.name)}</h2><small style="color:var(--muted)">Reg no ${s.regno} · ${esc(c.name)} ${full(c)?'('+esc(full(c))+')':''}</small></div></div>
  <p style="margin-top:14px">📧 ${esc(s.email)}<br>📞 ${esc(s.phone)}<br>${esc(cap(s.gender))} · ${s.age} years<br>💳 ${rs(s.fee)} – <span class="pill ${s.paid?'ok':'no'}">${s.paid?'Paid':'Pending'}</span></p>
  <p style="margin:14px 0 6px"><b>Subjects</b></p>${c.subjects.map(id=>`<span class="chip">${esc(sub(id).name)}</span>`).join('')}
  <div class="acts"><button class="btn ghost" data-edit="s:${s.regno}">Edit / delete</button><button class="btn" data-close>Close</button></div>`;
  $('#dlg').showModal();
}
function csv(){
  const h=['Regno','Name','Email','Gender','Phone','Age','Class','Fee','Fee status'];
  const r=db.students.map(s=>[s.regno,s.name,s.email,s.gender,s.phone,s.age,cls(s.cid).name,s.fee,s.paid?'Paid':'Pending']);
  const t=[h,...r].map(x=>x.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='students.csv';a.click();toast('students.csv downloaded');
}

document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-v],[data-go],[data-open],[data-pay],[data-act],[data-edit],[data-close],[data-hist],[data-spay],[data-sedit]');if(!t)return;const d=t.dataset;
  if(d.v||d.go){view=d.v||d.go;F={q:'',c:'',s:d.go=='fees'?'pending':''};if(view=='sal'){try{await loadSal()}catch(x){return toast(x.message)}}render()}
  else if('open' in d)detail(d.open);
  else if('hist' in d)hist(d.hist);
  else if('sedit' in d)salForm(d.sedit);
  else if('spay' in d){const r=SAL.rows.find(x=>x.tid==d.spay);run(()=>api('PUT',`/api/salaries/${r.tid}/${SM}`,{amount:r.amount,paid:!r.paid,note:r.note||''}),r.paid?'Marked as pending':'Salary marked as paid',keep)}
  else if('pay' in d){const s=db.students.find(x=>x.regno==d.pay);run(()=>api('PUT','/api/students/'+s.regno,{...sv(s),paid:!s.paid}),s.paid?'Marked as pending':'Marked as paid',refreshList)}
  else if('edit' in d){$('#dlg').close();const[k,id]=d.edit.split(':');({s:stuForm,t:teaForm,j:subForm,c:editClass})[k](+id)}
  else if('close' in d)$('#dlg').close();
  else if(d.act)({add:()=>stuForm(),csv,out:logout,pw:()=>pwView(false),addt:()=>teaForm(),addj:()=>subForm(),addc:()=>editClass()})[d.act]();
});
document.addEventListener('input',e=>{if(e.target.id=='q'){F.q=e.target.value;refreshList()}});
document.addEventListener('change',e=>{if(e.target.id=='sm'&&e.target.value){SM=e.target.value;loadSal().then(render).catch(x=>toast(x.message))}if(e.target.id=='fc'){F.c=e.target.value;refreshList()}if(e.target.id=='fs'){F.s=e.target.value;refreshList()}});
$('#dlg').addEventListener('click',e=>{if(e.target.id=='dlg')e.target.close()});
start();
</script>
</body>
